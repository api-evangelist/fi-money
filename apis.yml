aid: fi-money
name: Fi Money
description: >-
  Fi Money is a Bengaluru, India based money-management application and
  consumer fintech operated by Epifi Technologies, founded in 2019 by ex-Google
  Pay (Tez) executives Sujith Narayanan and Sumit Gwalani together with
  Neeraj Bhope and Prasanna Ranganathan. Fi is not a chartered bank; it
  delivers a millennial-focused mobile experience layered on top of partner
  RBI-licensed Federal Bank, providing zero-balance digital savings accounts,
  a Visa debit card, deposits, mutual funds, Indian and US stocks, EPF
  tracking, credit cards, personal loans, jump-style automated savings rules
  ("FIT Rules"), and an AI-powered money assistant. Fi has raised roughly
  US$169M across multiple rounds from investors including Sequoia Capital
  India (Peak XV), Ribbit Capital, Temasek, Alpha Wave, and B Capital, and
  serves Indian retail consumers via iOS and Android apps. There is no
  classic public REST developer API or partner banking-as-a-service surface;
  Fi's only developer-facing interface is the Fi MCP (Model Context Protocol)
  server — a JSON-RPC streaming endpoint at https://mcp.fi.money:8080/mcp/stream
  that lets users connect their own Fi account to LLM clients (Claude
  Desktop, Cursor, Windsurf, Gemini, ChatGPT) and call read-only tools such
  as fetch_net_worth, fetch_credit_report, fetch_epf_details,
  fetch_bank_transactions, fetch_mf_transactions, and fetch_stock_transactions
  to expose their net worth, holdings, EPF balance, credit report, and
  transactions to AI assistants. A hackathon-friendly mock server
  (epiFi/fi-mcp-dev, Go) and developer documentation (epiFi/mcp-docs) are
  published publicly on GitHub.
